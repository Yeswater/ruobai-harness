# The harness is this file: every row is a plugin mounted on one Context.
# Order does not matter — `inject` decides when a plugin activates.

# Model access. `mock` works offline; providers are registered dynamically from
# settings by llm-catalog (DeepSeek ships as the seeded provider).
- id: llm
  name: '@ruobai/llm'
  config:
    provider: mock
    model: mock-1

- id: llm-mock
  name: '@ruobai/llm-mock'

- id: llm-catalog
  name: '@ruobai/llm-catalog'

# Append-only session log plus its JSONL persistence adapter.
- id: sessions
  name: '@ruobai/session'

- id: sessions-jsonl
  name: '@ruobai/session-jsonl'
  config:
    root: .sessions

# Content-addressed snapshots of file writes, plus session rollback.
- id: checkpoints
  name: '@ruobai/checkpoints'
  config:
    root: !!js "process.cwd()"
    store: .ruobai/checkpoints
    # Large single files (styles.css is ~300 KB) must stay revertible. The
    # store is content-addressed, so only distinct versions are kept.
    maxBytes: 2097152

- id: checkpoints-web
  name: '@ruobai/checkpoints-web'

# Shell execution surface. `tool-bash` only knows `ctx.shell`, so swapping the
# executor (sandboxed vs direct) is a change here, not in code.
- id: shell
  name: '@ruobai/shell'

# Sandbox plugins. Removing `sandbox-macos` makes the sandbox unavailable, and
# `shell-sandboxed` then refuses to run commands instead of falling back to an
# unconfined spawn. To accept that risk explicitly, drop `shell-sandboxed` and
# mount `@ruobai/shell-direct` instead (see the note at the bottom).
- id: sandbox
  name: '@ruobai/sandbox'

- id: sandbox-policy
  name: '@ruobai/sandbox-policy'
  config:
    root: !!js "process.cwd()"
    network:
      # Network is off by default: the harness itself (LLM, MCP, A2A, web) does
      # not go through the shell sandbox, so closing it costs no functionality.
      #
      # The only reason this is not `deny` right now is dependency installs:
      # `pnpm install` fetches tarballs. macOS Seatbelt only accepts `*` or
      # `localhost` as a network host — a domain or an address literal makes
      # `sandbox-exec` reject the whole profile (exit 65), so per-host
      # allowlisting is not expressible here (appendix A28). `*` scoped to 443
      # is the narrowest grant that works. Set `mode: deny` once dependencies
      # are installed.
      mode: allowlist
      allow:
        - host: '*'
          port: 443
    limits:
      timeoutMs: 120000
      maxOutputBytes: 32768

- id: sandbox-guards
  name: '@ruobai/sandbox-guards'
  config:
    includeDefaults: true

- id: sandbox-macos
  name: '@ruobai/sandbox-macos'
  config:
    selfCheck: true
    # These three must stay `allow`; each was measured to break real commands
    # (see docs/sandbox-macos-appendix-f.md A15/A18):
    #   processFork  - without it no pipeline, `&&` or toolchain can start
    #   processInfo  - curl SIGTRAPs when `process-info-pidinfo self` is denied
    #   machLookup   - node/npm rely on mach services
    processFork: allow
    processInfo: allow
    machLookup: allow

- id: sandbox-denial
  name: '@ruobai/sandbox-denial'
  config:
    repeatWindowMs: 300000
    repeatThreshold: 2

# Attributes denials to operation/target via the kernel log. Without it denials
# still classify, but with low confidence, so escalation asks instead of relaxing.
- id: sandbox-native-log
  name: '@ruobai/sandbox-native-log'

- id: shell-sandboxed
  name: '@ruobai/shell-sandboxed'
  config:
    escalate: auto

# Harness-owned checks (lint / typecheck) are fixed commands run by the
# harness, not by the agent: they use this host executor so the agent's
# sandbox cannot break or observe them. Agent bash still uses the default
# (sandboxed) executor; the tool layer never selects an executor.
- id: shell-host
  name: '@ruobai/shell-direct'
  config:
    default: false
    shell: /bin/sh

# Status panel: sandbox state, guard list, denial timeline, session switch.
# Served over HTTP by the harness process (never a file the agent can write).
- id: sandbox-web
  name: '@ruobai/sandbox-web'

# Tool registry and the workspace tools (writes and shell require approval).
- id: tools
  name: '@ruobai/tools'

- id: tool-fs
  name: '@ruobai/tool-fs'
  config:
    root: !!js "process.cwd()"
    # A whole-file *read* is bounded so a stray large file cannot flood the
    # prompt; bigger files are served as line windows (offset/limit).
    maxBytes: 65536
    # Editing rewrites the file, not the context: keep this large enough for
    # the repository's biggest hand-edited files.
    maxEditBytes: 8388608
    readWindowLines: 2000

# Shell execution: confined cwd, timeout, output cap, approval.
- id: tool-bash
  name: '@ruobai/tool-bash'
  config:
    root: !!js "process.cwd()"

# Sub-agent delegation; child sessions stay out of the session list.
- id: tool-task
  name: '@ruobai/tool-task'

# Session-scoped task list. The model maintains it with `todo_write`; the
# projection feeds both the system prompt and the panel, so progress survives
# compaction and a UI reload.
- id: todo
  name: '@ruobai/todo'

- id: todo-web
  name: '@ruobai/todo-web'

# Visual verification: headless Chrome over CDP, screenshot + one expression.
# Each call gets an isolated profile and is closed afterwards. Navigation is
# limited to loopback unless `allowedHosts` names more.
- id: browser-preview
  name: '@ruobai/browser-preview'
  config:
    width: 1280
    height: 800

# Interactive shells for the UI. `script(1)` provides the pty, so no native
# module is needed. Terminals are user-facing only: no agent tool writes to
# them, because that would be a shell outside the command boundary.
- id: terminal
  name: '@ruobai/terminal'
  config:
    root: !!js "process.cwd()"

- id: terminal-web
  name: '@ruobai/terminal-web'

# Development servers declared in .ruobai/launch.json (or .claude/launch.json).
# The UI starts and stops them; no tool does, for the same boundary reason.
- id: preview
  name: '@ruobai/preview'
  config:
    root: !!js "process.cwd()"

- id: preview-web
  name: '@ruobai/preview-web'

# In-turn questions. `ask_user` blocks the tool call until the UI answers; an
# unanswered question is reported as such, never treated as consent.
- id: ask
  name: '@ruobai/ask'

- id: ask-web
  name: '@ruobai/ask-web'

# Implementation plans: the model submits one card, the user accepts it (the
# session switches to a writable mode and starts executing) or asks for
# changes (the model revises and submits again).
- id: plan
  name: '@ruobai/plan'

- id: plan-web
  name: '@ruobai/plan-web'

# Delivery contract: what is being delivered and how it will be accepted.
# acceptance is the only input of the delivery gate; the projection registers a
# system-prompt section that compaction does not fold away.
- id: contract
  name: '@ruobai/contract'

# Human approval for mutating tools.
- id: approval
  name: '@ruobai/approval'

# Tunable deadline. `onTimeout` is always deny: a sandbox escalation or a tool
# request that nobody answers fails closed.
- id: approval-deadline
  name: '@ruobai/approval-deadline'
  config:
    timeoutMs: 180000

# Turns sandbox denials into approvals. One-way dependency on approval, so the
# sandbox core never appears in the approval plugin's graph.
- id: sandbox-escalation
  name: '@ruobai/sandbox-escalation'
  config:
    relaxable: [fs-read-guarded, fs-write-guarded, fs-write-outside]
    neverRelaxable: [network-outbound, process-control, mach-lookup, appleevent]
    retrySafeCommands: [cat, ls, head, tail, wc, grep, git, node]

# Per-session permission presets enforced by the agent, tools and approvals.
- id: permissions
  name: '@ruobai/permissions'

# Deterministic gates. Commands are git-managed; the settings panel may toggle
# layers and budgets but cannot edit what runs.
- id: lint
  name: '@ruobai/lint'
  config:
    checkers:
      - id: biome-format
        scope: edit
        command: node_modules/.bin/biome check --write
        parser: plain
        writes: true
        executor: direct
        enabled: true
      - id: biome-lint
        scope: edit
        command: node_modules/.bin/biome check --reporter=json
        parser: biome
        executor: direct
        enabled: true
      - id: biome-stop
        scope: stop
        command: node_modules/.bin/biome check --reporter=json
        parser: biome
        executor: direct
        enabled: true
      - id: typecheck
        scope: stop
        command: node_modules/.bin/tsc -p tsconfig.json --pretty false && node_modules/.bin/tsc -p packages/ui-app/tsconfig.json --pretty false
        parser: tsc
        executor: direct
        enabled: true

- id: hooks
  name: '@ruobai/hooks'

# System prompt assembly, token estimate, and LLM compaction.
- id: context
  name: '@ruobai/context'
  config:
    compactAt: !!js "Number(process.env.RBU_COMPACT_AT ?? 48000)"

# Agent modes: each is a separate plugin and can be removed independently.
# Trajectory projections: turns, records, timings and token totals folded from
# the session log. The web half serves snapshots and live frames.
- id: trajectory
  name: '@ruobai/trajectory'
  config:
    namespace: trajectory

- id: trajectory-web
  name: '@ruobai/trajectory-web'
  config:
    pageTurns: 25
    frameIntervalMs: 50

- id: modes
  name: '@ruobai/modes'

- id: mode-ask
  name: '@ruobai/mode-ask'

- id: mode-plan
  name: '@ruobai/mode-plan'

- id: mode-agent
  name: '@ruobai/mode-agent'

- id: mode-goal
  name: '@ruobai/mode-goal'

# Turn driver: llm + tools + session log. Turns end when the model stops
# calling tools, the user stops them, or an error occurs.
- id: agent
  name: '@ruobai/agent'

# Browser-facing projection consumed by ui-server.
- id: chat
  name: '@ruobai/chat'

# Session export: Markdown for reading, JSONL for replay. Read-only.
- id: session-export
  name: '@ruobai/session-export'

# Gate status API, SSE channel and the Settings → 门禁 panel.
- id: hooks-web
  name: '@ruobai/hooks-web'

- id: timer
  name: '@ruobai/cordis-plugin-timer'

# HTTP host and its adapters. `web-server` knows nothing about the UI; routes,
# static assets, auth and WebSocket upgrades are separate plugins.
- id: web
  name: '@ruobai/web-server'
  config:
    host: 127.0.0.1
    # `pnpm dev --port 4400` sets PORT before boot; unset keeps 4310.
    port: !!js "process.env.PORT ? Number(process.env.PORT) : 4310"

- id: ui-api
  name: '@ruobai/ui-server'

- id: ui-static
  name: '@ruobai/web-static'
  config:
    dev: !!js "process.env.NODE_ENV !== 'production'"

# Disabled unless RBU_TOKEN is set; loopback development needs no token.
- id: web-auth
  name: '@ruobai/web-auth'
  config:
    token: !!js "process.env.RBU_TOKEN ?? ''"

- id: web-ws
  name: '@ruobai/web-ws'

- id: workspace
  name: '@ruobai/workspace'
  config:
    root: !!js "process.cwd()"

- id: workspace-web
  name: '@ruobai/workspace-web'

# The commit card: after a completed turn (or `/commit`) prepare a message from
# the session title and the dirty paths, then commit only when the user accepts.
- id: commit-prompt
  name: '@ruobai/commit-prompt'
  config:
    auto: true

- id: commit-prompt-web
  name: '@ruobai/commit-prompt-web'

# Git status, staging, commits, history, branches and remote sync.
- id: git
  name: '@ruobai/git'

- id: git-web
  name: '@ruobai/git-web'

# Gitee browsing, publishing, issues and pull requests. The token lives in
# Settings → Gitee; like MCP/A2A these host-side requests bypass the shell
# sandbox, while the workspace tools stay confined.
- id: gitee
  name: '@ruobai/gitee'

- id: gitee-web
  name: '@ruobai/gitee-web'

# Agent Skills: discovers SKILL.md bundles under .ruobai/.claude/.agents.
- id: skills
  name: '@ruobai/skills'

- id: skills-web
  name: '@ruobai/skills-web'

# Cross-session memory and the project wiki. Both contribute prompt sections
# through `context` and keep their state under .ruobai/ (see
# docs/memory-and-wiki.md). Removing either row drops the feature cleanly.
- id: commands
  name: '@ruobai/commands'

- id: memory
  name: '@ruobai/memory'

# Deterministic, offline extraction from user turns. Switch to `llm` only when
# a provider is configured: it has daily call/token caps and a breaker.
- id: memory-distill
  name: '@ruobai/memory-distill'
  config:
    writeMode: rules

- id: memory-web
  name: '@ruobai/memory-web'

- id: wiki
  name: '@ruobai/wiki'

- id: wiki-web
  name: '@ruobai/wiki-web'

# Optional wiki automation: per-turn recall and idle proposal drafts.
# Both default off; switches live in Settings data (`wiki.recall` / `wiki.distill`).
- id: wiki-automation
  name: '@ruobai/wiki-automation'

# Optional semantic half for wiki search. Unmounted means BM25 only; when
# mounted, BM25 and the vector ranking are fused with RRF. Needs a local
# embedding model (Ollama) or an OpenAI-compatible embeddings endpoint.
# - id: wiki-embed
#   name: '@ruobai/wiki-embed'
#   config:
#     kind: ollama
#     baseUrl: http://127.0.0.1:11434
#     model: nomic-embed-text

# One tool across memory, wiki and skills, with rule-based type quotas.
- id: context-search
  name: '@ruobai/context-search'

- id: settings
  name: '@ruobai/settings'
  config:
    path: .ruobai/settings.json

- id: settings-web
  name: '@ruobai/settings-web'

# API keys and tokens move out of settings.json into the OS keychain (macOS)
# or a 0600 file. Removing this row restores plaintext storage.
- id: secrets
  name: '@ruobai/secrets'

# MCP servers are configured in Settings → MCP and hot-reloaded. Each tool is
# exposed as mcp__<server>__<tool>.
- id: mcp
  name: '@ruobai/mcp'

# MCP servers come from .mcp.json / .ruobai/mcp.json plus Settings → MCP.
- id: mcp-config
  name: '@ruobai/mcp-config'

- id: mcp-catalog
  name: '@ruobai/mcp-catalog'

- id: mcp-web
  name: '@ruobai/mcp-web'

# Remote A2A agents from .ruobai/a2a.json; each agent becomes a2a__<id>.
- id: a2a
  name: '@ruobai/a2a'

- id: a2a-web
  name: '@ruobai/a2a-web'

# Client-half plugins: discovered from loader entries whose package.json
# declares `rbu.client`, bundled with esbuild and loaded by the UI at runtime.
- id: client-modules
  name: '@ruobai/client-modules'
