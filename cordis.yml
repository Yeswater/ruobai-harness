# The harness is this file: every row is a plugin mounted on one Context.
# Order does not matter — `inject` decides when a plugin activates.

# Model access. `mock` works offline; providers are registered dynamically from
# settings by llm-catalog (DeepSeek ships as the seeded provider).
- id: llm
  name: '@ruobai/llm'
  config:
    provider: mock
    model: mock-1

- id: llm-mock
  name: '@ruobai/llm-mock'

- id: llm-catalog
  name: '@ruobai/llm-catalog'

# Append-only session log plus its JSONL persistence adapter.
- id: sessions
  name: '@ruobai/session'

- id: sessions-jsonl
  name: '@ruobai/session-jsonl'
  config:
    root: .sessions

# Content-addressed snapshots of file writes, plus session rollback.
- id: checkpoints
  name: '@ruobai/checkpoints'
  config:
    root: !!js "process.cwd()"
    store: .ruobai/checkpoints

- id: checkpoints-web
  name: '@ruobai/checkpoints-web'

# Shell execution surface. `tool-bash` only knows `ctx.shell`, so swapping the
# executor (sandboxed vs direct) is a change here, not in code.
- id: shell
  name: '@ruobai/shell'

# Sandbox plugins. Removing `sandbox-macos` makes the sandbox unavailable, and
# `shell-sandboxed` then refuses to run commands instead of falling back to an
# unconfined spawn. To accept that risk explicitly, drop `shell-sandboxed` and
# mount `@ruobai/shell-direct` instead (see the note at the bottom).
- id: sandbox
  name: '@ruobai/sandbox'

- id: sandbox-policy
  name: '@ruobai/sandbox-policy'
  config:
    root: !!js "process.cwd()"
    network:
      # Network is off by default: the harness itself (LLM, MCP, A2A, web) does
      # not go through the shell sandbox, so closing it costs no functionality.
      #
      # The only reason this is not `deny` right now is dependency installs:
      # `pnpm install` fetches tarballs. macOS Seatbelt only accepts `*` or
      # `localhost` as a network host — a domain or an address literal makes
      # `sandbox-exec` reject the whole profile (exit 65), so per-host
      # allowlisting is not expressible here (appendix A28). `*` scoped to 443
      # is the narrowest grant that works. Set `mode: deny` once dependencies
      # are installed.
      mode: allowlist
      allow:
        - host: '*'
          port: 443
    limits:
      timeoutMs: 120000
      maxOutputBytes: 32768

- id: sandbox-guards
  name: '@ruobai/sandbox-guards'
  config:
    includeDefaults: true

- id: sandbox-macos
  name: '@ruobai/sandbox-macos'
  config:
    selfCheck: true
    # These three must stay `allow`; each was measured to break real commands
    # (see docs/sandbox-macos-appendix-f.md A15/A18):
    #   processFork  - without it no pipeline, `&&` or toolchain can start
    #   processInfo  - curl SIGTRAPs when `process-info-pidinfo self` is denied
    #   machLookup   - node/npm rely on mach services
    processFork: allow
    processInfo: allow
    machLookup: allow

- id: sandbox-denial
  name: '@ruobai/sandbox-denial'
  config:
    repeatWindowMs: 300000
    repeatThreshold: 2

# Attributes denials to operation/target via the kernel log. Without it denials
# still classify, but with low confidence, so escalation asks instead of relaxing.
- id: sandbox-native-log
  name: '@ruobai/sandbox-native-log'

- id: shell-sandboxed
  name: '@ruobai/shell-sandboxed'
  config:
    escalate: auto

# Status panel: sandbox state, guard list, denial timeline, session switch.
# Served over HTTP by the harness process (never a file the agent can write).
- id: sandbox-web
  name: '@ruobai/sandbox-web'

# Tool registry and the workspace tools (writes and shell require approval).
- id: tools
  name: '@ruobai/tools'

- id: tool-fs
  name: '@ruobai/tool-fs'
  config:
    root: !!js "process.cwd()"

# Shell execution: confined cwd, timeout, output cap, approval.
- id: tool-bash
  name: '@ruobai/tool-bash'
  config:
    root: !!js "process.cwd()"

# Sub-agent delegation; child sessions stay out of the session list.
- id: tool-task
  name: '@ruobai/tool-task'

# Human approval for mutating tools.
- id: approval
  name: '@ruobai/approval'

# Tunable deadline. `onTimeout` is always deny: a sandbox escalation or a tool
# request that nobody answers fails closed.
- id: approval-deadline
  name: '@ruobai/approval-deadline'
  config:
    timeoutMs: 180000

# Turns sandbox denials into approvals. One-way dependency on approval, so the
# sandbox core never appears in the approval plugin's graph.
- id: sandbox-escalation
  name: '@ruobai/sandbox-escalation'
  config:
    relaxable: [fs-read-guarded, fs-write-guarded, fs-write-outside]
    neverRelaxable: [network-outbound, process-control, mach-lookup, appleevent]
    retrySafeCommands: [cat, ls, head, tail, wc, grep, git, node]

# Per-session permission presets enforced by the agent, tools and approvals.
- id: permissions
  name: '@ruobai/permissions'

# Deterministic gates. Commands are git-managed; the settings panel may toggle
# layers and budgets but cannot edit what runs.
- id: lint
  name: '@ruobai/lint'
  config:
    checkers:
      - id: biome-format
        scope: edit
        command: node_modules/.bin/biome check --write
        parser: plain
        writes: true
        enabled: true
      - id: biome-lint
        scope: edit
        command: node_modules/.bin/biome check --reporter=json
        parser: biome
        enabled: true
      - id: biome-stop
        scope: stop
        command: node_modules/.bin/biome check --reporter=json
        parser: biome
        enabled: true
      - id: typecheck
        scope: stop
        command: node_modules/.bin/tsc -p tsconfig.json --pretty false && node_modules/.bin/tsc -p packages/ui-app/tsconfig.json --pretty false
        parser: tsc
        enabled: true

- id: hooks
  name: '@ruobai/hooks'

# System prompt assembly, token estimate, and LLM compaction.
- id: context
  name: '@ruobai/context'
  config:
    compactAt: !!js "Number(process.env.RBU_COMPACT_AT ?? 48000)"

# Agent modes: each is a separate plugin and can be removed independently.
# Trajectory projections: turns, records, timings and token totals folded from
# the session log. The web half serves snapshots and live frames.
- id: trajectory
  name: '@ruobai/trajectory'
  config:
    namespace: trajectory

- id: trajectory-web
  name: '@ruobai/trajectory-web'
  config:
    pageTurns: 25
    frameIntervalMs: 50

- id: modes
  name: '@ruobai/modes'

- id: mode-ask
  name: '@ruobai/mode-ask'

- id: mode-plan
  name: '@ruobai/mode-plan'

- id: mode-agent
  name: '@ruobai/mode-agent'

- id: mode-goal
  name: '@ruobai/mode-goal'

# Turn driver: llm + tools + session log. Turns end when the model stops
# calling tools, the user stops them, or an error occurs.
- id: agent
  name: '@ruobai/agent'

# Browser-facing projection consumed by ui-server.
- id: chat
  name: '@ruobai/chat'

# Gate status API, SSE channel and the Settings → 门禁 panel.
- id: hooks-web
  name: '@ruobai/hooks-web'

- id: timer
  name: '@ruobai/cordis-plugin-timer'

# HTTP host and its adapters. `web-server` knows nothing about the UI; routes,
# static assets, auth and WebSocket upgrades are separate plugins.
- id: web
  name: '@ruobai/web-server'
  config:
    host: 127.0.0.1
    # `pnpm dev --port 4400` sets PORT before boot; unset keeps 4310.
    port: !!js "process.env.PORT ? Number(process.env.PORT) : 4310"

- id: ui-api
  name: '@ruobai/ui-server'

- id: ui-static
  name: '@ruobai/web-static'
  config:
    dev: !!js "process.env.NODE_ENV !== 'production'"

# Disabled unless RBU_TOKEN is set; loopback development needs no token.
- id: web-auth
  name: '@ruobai/web-auth'
  config:
    token: !!js "process.env.RBU_TOKEN ?? ''"

- id: web-ws
  name: '@ruobai/web-ws'

- id: workspace
  name: '@ruobai/workspace'
  config:
    root: !!js "process.cwd()"

- id: workspace-web
  name: '@ruobai/workspace-web'

# Git status, staging, commits, history, branches and remote sync.
- id: git
  name: '@ruobai/git'

- id: git-web
  name: '@ruobai/git-web'

# Agent Skills: discovers SKILL.md bundles under .ruobai/.claude/.agents.
- id: skills
  name: '@ruobai/skills'

- id: skills-web
  name: '@ruobai/skills-web'

- id: settings
  name: '@ruobai/settings'
  config:
    path: .ruobai/settings.json

- id: settings-web
  name: '@ruobai/settings-web'

# MCP servers are configured in Settings → MCP and hot-reloaded. Each tool is
# exposed as mcp__<server>__<tool>.
- id: mcp
  name: '@ruobai/mcp'

# MCP servers come from .mcp.json / .ruobai/mcp.json plus Settings → MCP.
- id: mcp-config
  name: '@ruobai/mcp-config'

- id: mcp-catalog
  name: '@ruobai/mcp-catalog'

- id: mcp-web
  name: '@ruobai/mcp-web'

# Remote A2A agents from .ruobai/a2a.json; each agent becomes a2a__<id>.
- id: a2a
  name: '@ruobai/a2a'

- id: a2a-web
  name: '@ruobai/a2a-web'

# Client-half plugins: discovered from loader entries whose package.json
# declares `rbu.client`, bundled with esbuild and loaded by the UI at runtime.
- id: client-modules
  name: '@ruobai/client-modules'
